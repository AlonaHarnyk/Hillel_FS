<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Mondrian Table Simplified</title>
    <style>
      .mondrian-wrap {
        width: 700px;
        height: 700px;
        margin: 20px auto;
      }

      table.mondrian {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      td {
        border: 12px solid #000;
        padding: 0;
      }

      .white {
        background: #fff;
      }
      .red {
        background: #e21b1b;
      }
      .yellow {
        background: #ffd400;
      }
      .blue {
        background: #0032cc;
      }
      .black {
        background: #000;
      }

      tr {
        height: 25%;
      }
    </style>
  </head>
  <body>
    <div class="mondrian-wrap">
      <table class="mondrian">
        <tr>
          <td class="red" colspan="2" rowspan="2"></td>
          <td class="yellow"></td>
          <td class="white"></td>
        </tr>
        <tr>
          <td class="white"></td>
          <td class="white"></td>
        </tr>
        <tr>
          <td class="black" colspan="2" rowspan="2"></td>
          <td class="white"></td>
          <td class="white"></td>
        </tr>
        <tr>
          <td class="blue" colspan="2"></td>
        </tr>
      </table>
    </div>
  </body>
</html>
