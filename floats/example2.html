<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <style>
      .container {
        border: 1px solid #aaa;
        padding: 10px;
      }

      .left {
        float: left;
        width: 45%;
        background: lightcoral;
        height: 80px;
      }

      .right {
        float: right;
        width: 45%;
        background: lightseagreen;
        height: 80px;
      }

      .clear {
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">Лівий блок</div>
      <div class="right">Правий блок</div>
      <div class="clear"></div>
      <p>Текст нижче двох плаваючих блоків.</p>
    </div>
  </body>
</html>
