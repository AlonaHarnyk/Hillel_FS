<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <style>
      .column {
        float: left;
        width: 30%;
        margin: 1.5%;
        height: 80px;
        background: lightblue;
        text-align: center;
        line-height: 80px;
      }

      .clearfix::after {
        content: "";
        display: block;
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="clearfix">
      <div class="column">1</div>
      <div class="column">2</div>
      <div class="column">3</div>
    </div>

    <p>Це текст під трьома колонками.</p>
  </body>
</html>
