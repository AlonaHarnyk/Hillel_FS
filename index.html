<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="./index.html" class="header__logo">Dudeshape</a>
        <nav class="navigation">
          <ul class="navigation__list">
            <li><a href="" class="navigation__link">Home</a></li>
            <li><a href="" class="navigation__link">Products</a></li>
            <li><a href="" class="navigation__link">About Us</a></li>
            <li><a href="" class="navigation__link">Contact Us</a></li>
          </ul>
        </nav>
        <ul class="header__links">
          <li>
            <a href="">
              <svg width="24" height="24" class="icon">
                <use href="./images/sprite.svg#icon-profile"></use>
              </svg>
            </a>
          </li>
          <li>
            <a href="">
              <svg width="24" height="24" class="icon">
                <use href="./images/sprite.svg#icon-buy"></use>
              </svg>
            </a>
          </li>
          <li>
            <a href="">
              <svg width="24" height="24" class="icon--fill">
                <use href="./images/sprite.svg#icon-burger"></use>
              </svg>
            </a>
          </li>
        </ul>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero__inner">
          <div class="container">
            <h1 class="hero__title">Get Your Best Cosmetic Products Here</h1>
            <p class="hero__text">
              Lorem Ipsum is simply dummy text of the printing and typesetting
              industry. Lorem Ipsum has been the industry's standard dummy
            </p>
            <form class="search">
              <input class="search__input" placeholder="Search..." />
              <button class="search__button">
                <svg width="16" height="16">
                  <use href="./images/sprite.svg#icon-search"></use>
                </svg>
              </button>
            </form>
            <button class="hero__button">Shop Now</button>
            <ul class="hero__controls">
              <li>
                <button>
                  <svg width="40" height="40" class="icon">
                    <use href="./images/sprite.svg#icon-arrow-left"></use>
                  </svg>
                </button>
              </li>
              <li>
                <button>
                  <svg width="40" height="40" class="icon">
                    <use href="./images/sprite.svg#icon-arrow-right"></use>
                  </svg>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
